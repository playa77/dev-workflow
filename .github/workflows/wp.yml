# Hand-maintained for the kit repository itself; it mirrors the template in
# workflow/scripts/install.py. The kit has no DECISIONS.md or CHANGELOG.md of its
# own, so those two lanes are absent here and present in an installed project.
#
# Trust boundary: the risk job runs the gate implementation (risk-gate.py,
# risk-scan.py and workflow/config.json) from the repository's protected default
# branch. The pull request head is fetched and inspected as a git diff; the gate
# imports and executes nothing from it. The test job runs pull request code with
# read-only permissions and without persisted checkout credentials.
#
# Branch protection must require both the `workflow gates` check and the
# `risk-gate` commit status. They are independent: a green risk decision never
# compensates for failed tests. The risk job's own check carries the event's
# SHA and cannot clear a failure recorded on the pull request head when a review
# approval arrives.
name: wp

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

jobs:
  gates:
    name: workflow gates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Config
        run: python3 workflow/scripts/check-config.py
      - name: Doctor
        run: python3 workflow/scripts/doctor.py
      - name: Intake
        if: hashFiles('workflow/state/intake.json') != ''
        run: python3 workflow/scripts/check-intake.py
      - name: Work packages
        if: hashFiles('docs/wp/*.md') != ''
        run: python3 workflow/scripts/check-wp.py
      - name: Specification
        if: hashFiles('docs/spec/SPEC.md') != ''
        run: python3 workflow/scripts/check-spec.py
      - name: Roadmap
        if: hashFiles('docs/roadmap/ROADMAP.md') != ''
        run: python3 workflow/scripts/check-roadmap.py
      - name: Test integrity
        run: bash workflow/scripts/check-test-integrity.sh --verify
      - name: Caller existence
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: python3 workflow/scripts/check-caller-existence.py --base "origin/$BASE_REF" --committed
      - name: Full suite
        run: python3 workflow/scripts/run-role.py test_full
      - name: Declaration
        if: github.event_name != 'push'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/declaration.md
          python3 workflow/scripts/check-declaration.py /tmp/declaration.md

  risk:
    name: risk gate
    if: github.event_name != 'push'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      # Trusted implementation: the repository's default branch, never the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fetch the head as a git object. Nothing from it is executed here; the
      # credentials persisted by checkout are used by this fetch and by nothing
      # that pull request code can influence.
      - name: Fetch pull request head (data only)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          test "$(git rev-parse refs/remotes/pull/head)" = "$HEAD_SHA"
      - name: Risk gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 workflow/scripts/risk-gate.py --base "origin/$BASE_REF" --head "$HEAD_SHA" --pr "$PR_NUMBER" --author "$PR_AUTHOR" --publish
