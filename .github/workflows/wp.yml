# Hand-maintained for the kit repository itself; it mirrors the template in
# workflow/scripts/install.py. The kit has no DECISIONS.md or CHANGELOG.md of its
# own, so those two lanes are absent here and present in an installed project.
name: wp

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gates:
    name: workflow gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Config
        run: python3 workflow/scripts/check-config.py
      - name: Doctor
        run: python3 workflow/scripts/doctor.py
      - name: Intake
        if: hashFiles('workflow/state/intake.json') != ''
        run: python3 workflow/scripts/check-intake.py
      - name: Work packages
        if: hashFiles('docs/wp/*.md') != ''
        run: python3 workflow/scripts/check-wp.py
      - name: Specification
        if: hashFiles('docs/spec/SPEC.md') != ''
        run: python3 workflow/scripts/check-spec.py
      - name: Roadmap
        if: hashFiles('docs/roadmap/ROADMAP.md') != ''
        run: python3 workflow/scripts/check-roadmap.py
      - name: Test integrity
        run: bash workflow/scripts/check-test-integrity.sh --verify
      - name: Caller existence
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 workflow/scripts/check-caller-existence.py --base "origin/$BASE_REF" --committed
      - name: Full suite
        run: python3 -m unittest discover -s tests -t .
      - name: Declaration
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/declaration.md
          python3 workflow/scripts/check-declaration.py /tmp/declaration.md
      - name: Risk scan
        id: risk
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 workflow/scripts/risk-scan.py --base "origin/$BASE_REF" --fail-on-trigger
      - name: Flag for human review
        if: failure() && steps.risk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create needs-human --description "Risk trigger: human review required" --force || true
          gh pr edit "$PR_NUMBER" --add-label needs-human || true
